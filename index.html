<!DOCTYPE html>
<!--
    Weather Command Center
    Version: 0.8.0
    Last Updated: 2026-03-15
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Weather HQ">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description" content="Weather Command Center - Multi-location weather dashboard">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Weather Command Center</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <link rel="stylesheet" href="css/styles.css?v=1.20.0">
    <link rel="manifest" href="pwa/manifest.json">
    <link rel="apple-touch-icon" href="pwa/icon.svg">
</head>
<body>
    <div id="appShell">
    <div class="header">
        <h1>WEATHER COMMAND CENTER</h1>
        <div class="header-refresh">
            <div id="headerActions" class="header-actions"></div>
            <button class="settings-btn" id="settingsBtn" onclick="openSettings()" title="Settings">
                <span class="settings-icon">⚙</span>
            </button>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshWeather()">
                <span class="refresh-icon" id="refreshIcon">↻</span>
            </button>
            <select id="collectCitySelect" style="display:none"><option value="all">All Cities</option></select>
            <button id="collectBtn" style="display:none" onclick="toggleCollection()">⏺ Collect</button>
            <button id="healthCheckBtn" style="display:none" onclick="runHealthCheck()" title="Run collection health check">🩺 Check</button>
            <span id="collectStatus" style="display:none"></span>
            <span class="last-updated" id="lastUpdated"></span>
        </div>
        <div id="locationTabs" class="location-tabs"></div>
        <div class="edit-mode-hint">Drag to reorder · Tap × to remove · Tap DONE to exit</div>
    </div>

    <div id="weatherContainer"></div>
    </div><!-- /appShell -->

    <!-- Alert Modal -->
    <div class="alert-modal-overlay" id="alertModal" onclick="if(event.target===this)closeAlertModal()">
        <div class="alert-modal">
            <div class="alert-modal-header">
                <h2 id="alertModalTitle">⚠️ Weather Alerts</h2>
                <button class="alert-modal-close" onclick="closeAlertModal()">✕</button>
            </div>
            <div class="alert-modal-body" id="alertModalBody"></div>
        </div>
    </div>

    <!-- Changelog Modal -->
    <div class="alert-modal-overlay" id="changelogModal" onclick="if(event.target===this)closeChangelog()">
        <div class="alert-modal changelog-modal">
            <div class="alert-modal-header changelog-header">
                <h2 id="changelogModalTitle">What's New</h2>
                <button class="alert-modal-close" onclick="closeChangelog()">✕</button>
            </div>
            <div class="alert-modal-body" id="changelogModalBody"></div>
        </div>
    </div>

    <!-- Recent Precip Chart Modal -->
    <div class="pc-overlay" id="precipChartOverlay" onclick="if(event.target===this)closePrecipChart()">
        <div class="pc-modal">
            <div id="precipChartBody"></div>
        </div>
    </div>

    <!-- Pressure Chart Modal -->
    <div class="pc-overlay" id="pressureChartOverlay" onclick="if(event.target===this)closePressureChart()">
        <div class="pc-modal">
            <div id="pressureChartBody"></div>
        </div>
    </div>

    <!-- AQI Chart Modal -->
    <div class="pc-overlay" id="aqiChartOverlay" onclick="if(event.target===this)closeAQIChart()">
        <div class="pc-modal">
            <div id="aqiChartBody"></div>
        </div>
    </div>

    <!-- Current Condition / Station Obs Detail Modal -->
    <div class="pc-overlay" id="obsDetailOverlay" onclick="if(event.target===this)closeConditionDetail()">
        <div class="obs-modal">
            <button class="obs-modal-close" onclick="closeConditionDetail()">✕</button>
            <div id="obsDetailBody"></div>
        </div>
    </div>

    <!-- Forecast Day Detail Modal -->
    <div class="forecast-detail-overlay" id="forecastDetailOverlay"
         onclick="if(event.target===this)closeForecastDetail()">
        <div class="forecast-detail-modal" id="forecastDetailModal">
            <div class="forecast-detail-handle"></div>
            <div class="forecast-detail-header">
                <button class="forecast-detail-close" onclick="closeForecastDetail()">✕</button>
                <span class="forecast-detail-counter" id="forecastDetailCounter">1 of 7</span>
            </div>
            <div class="forecast-detail-body" id="forecastDetailBody"></div>
            <div class="forecast-detail-nav">
                <button class="forecast-nav-btn" id="forecastPrevBtn" onclick="navigateForecastDetail(-1)">‹</button>
                <button class="forecast-nav-btn" id="forecastNextBtn" onclick="navigateForecastDetail(1)">›</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
        <div class="settings-content">
            <div class="settings-header">
                <h3>SETTINGS</h3>
                <button class="settings-close" onclick="closeSettings()">✕</button>
            </div>
            <div class="settings-body" id="settingsBody"></div>
        </div>
    </div>

    <script src="src/state/store.js?v=1.13.2"></script>
    <script src="src/utils/weatherCodes.js?v=1.0.0"></script>
    <script src="src/utils/risk.js?v=1.2.7"></script>
    <script src="src/utils/dailyIcon.js?v=1.1.0"></script>
    <script src="src/utils/dom.js?v=0.6.1"></script>
    <script src="src/utils/moon.js?v=1.0.0"></script>
    <script src="src/utils/metarParse.js?v=1.0.0"></script>
    <script src="src/utils/format.js?v=0.8.7"></script>
    <script src="src/utils/chartHelpers.js?v=1.0.0"></script>
    <script src="src/utils/geo.js?v=1.0.0"></script>
    <script src="src/services/geocode.js?v=1.9.3"></script>
    <script src="src/services/openMeteo.js?v=1.0.2"></script>
    <script src="src/services/modelComparison.js?v=1.0.0"></script>
    <script src="src/services/nws.js?v=1.0.0"></script>
    <script src="src/services/spc.js?v=1.0.0"></script>
    <script src="src/services/recentPrecip.js?v=1.8.1"></script>
    <script src="src/services/observations.js?v=1.8.1"></script>
    <script src="src/services/radarSampler.js?v=1.0.0"></script>
    <script src="src/services/lightning.js?v=1.0.0"></script>
    <script src="src/services/nowcastLogger.js?v=1.0.2"></script>
    <script src="src/services/nowcast.js?v=1.0.5"></script>
    <script src="src/services/nowcastDisplay.js?v=1.0.0"></script>
    <script src="src/services/geolocation.js?v=1.0.0"></script>
    <script src="src/ui/locationPicker.js?v=1.9.3"></script>
    <script src="src/ui/pressureChart.js?v=1.0.0"></script>
    <script src="src/ui/aqiChart.js?v=1.0.5"></script>
    <script src="src/ui/precipChart.js?v=1.0.0"></script>
    <script src="src/ui/forecastModal.js?v=1.1.0"></script>
    <script src="src/ui/hourly.js?v=1.0.0"></script>
    <script src="src/ui/share.js?v=1.0.0"></script>
    <script src="src/ui/renderDashboard.js?v=1.13.5"></script>
    <script src="src/ui/tabDrag.js?v=1.1.7"></script>
    <script src="src/main.js?v=1.13.8"></script>
</body>
</html>
