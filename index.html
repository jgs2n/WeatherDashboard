<script>
(function() {
    var SA = window.navigator.standalone === true;
    var DM = window.matchMedia('(display-mode: standalone)').matches;
    if (!SA && !DM) return;

    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;'
        + 'padding-left:env(safe-area-inset-left,0px);'
        + 'padding-right:env(safe-area-inset-right,0px);visibility:hidden;';
    document.body.appendChild(probe);

    var snapshots = [];

    function measure(label) {
        var de = document.documentElement;
        var appShell = document.getElementById('appShell');
        var wc = document.getElementById('weatherContainer');
        var probeCS = getComputedStyle(probe);

        var snap = {
            t: label,
            innerW: window.innerWidth,
            clientW: de.clientWidth,
            scrollW: de.scrollWidth,
            screenW: screen.width,
            bodyW: document.body ? document.body.offsetWidth : '?',
            bodyCS: document.body ? getComputedStyle(document.body).width : '?',
            bodyPad: document.body ? getComputedStyle(document.body).padding : '?',
            shellW: appShell ? appShell.offsetWidth : '?',
            shellCS: appShell ? getComputedStyle(appShell).width : '?',
            shellPad: appShell ? getComputedStyle(appShell).padding : '?',
            wcW: wc ? wc.offsetWidth : '?',
            safeL: probeCS.paddingLeft,
            safeR: probeCS.paddingRight,
            dmMatch: window.matchMedia('(display-mode: standalone)').matches,
            overflows: []
        };

        var all = document.querySelectorAll('*');
        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.offsetWidth > snap.innerW + 2) {
                var id = el.id || '';
                var cls = el.className || '';
                var tag = el.tagName;
                snap.overflows.push(tag
                    + (id ? '#' + id : '')
                    + (cls ? '.' + String(cls).split(' ')[0] : '')
                    + '=' + el.offsetWidth + 'px');
                if (snap.overflows.length >= 8) break;
            }
        }

        snapshots.push(snap);
        console.log('[PWA-DIAG] ' + label, JSON.stringify(snap));
        render();
    }

    var overlay = document.createElement('div');
    overlay.id = 'pwa-diag';
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;'
        + 'background:rgba(0,0,0,0.88);color:#0f0;font:10px/1.4 monospace;'
        + 'padding:8px;max-height:60vh;overflow-y:auto;'
        + '-webkit-overflow-scrolling:touch;';
    document.body.appendChild(overlay);

    var hidden = false;
    overlay.addEventListener('click', function(e) {
        e.stopPropagation();
        hidden = !hidden;
        overlay.style.display = hidden ? 'none' : 'block';
    });
    document.addEventListener('click', function() {
        if (hidden) { hidden = false; overlay.style.display = 'block'; }
    });

    function render() {
        var h = '<b>PWA VIEWPORT DIAG</b>  (tap to hide)<br>';
        for (var i = 0; i < snapshots.length; i++) {
            var s = snapshots[i];
            var over = s.scrollW > s.clientW;
            h += '<br><b style="color:' + (over ? '#f55' : '#0f0') + '">'
                + s.t + (over ? ' ⚠ OVERFLOW' : ' ✓') + '</b><br>';
            h += 'inner=' + s.innerW + ' client=' + s.clientW
                + ' scroll=' + s.scrollW + ' screen=' + s.screenW + '<br>';
            h += 'body: w=' + s.bodyW + ' cs=' + s.bodyCS
                + ' pad=' + s.bodyPad + '<br>';
            h += 'shell: w=' + s.shellW + ' cs=' + s.shellCS
                + ' pad=' + s.shellPad + '<br>';
            h += 'wc: w=' + s.wcW + '<br>';
            h += 'safe: L=' + s.safeL + ' R=' + s.safeR
                + ' dm=' + s.dmMatch + '<br>';
            if (s.overflows.length) {
                h += '<span style="color:#f55">WIDE: '
                    + s.overflows.join(', ') + '</span><br>';
            }
        }
        overlay.innerHTML = h;
    }

    measure('T0-immediate');
    requestAnimationFrame(function() { measure('T1-rAF'); });
    setTimeout(function() { measure('T2-100ms'); }, 100);
    setTimeout(function() { measure('T3-500ms'); }, 500);
    setTimeout(function() { measure('T4-2s'); }, 2000);
})();
</script>
    <div id="appShell">
    <div class="header">
        <h1>WEATHER COMMAND CENTER</h1>
        <div class="header-refresh">
            <div id="headerActions" class="header-actions"></div>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshWeather()">
                <span class="refresh-icon" id="refreshIcon">↻</span>
            </button>
            <span class="last-updated" id="lastUpdated"></span>
        </div>
        <div id="locationTabs" class="location-tabs"></div>
        <div class="edit-mode-hint">Drag to reorder · Tap × to remove · Tap DONE to exit</div>
    </div>

    <div id="weatherContainer"></div>
    </div><!-- /appShell -->

    <!-- Alert Modal -->
    <div class="alert-modal-overlay" id="alertModal" onclick="if(event.target===this)closeAlertModal()">
        <div class="alert-modal">
            <div class="alert-modal-header">
                <h2>⚠️ Weather Alerts</h2>
                <button class="alert-modal-close" onclick="closeAlertModal()">✕</button>
            </div>
            <div class="alert-modal-body" id="alertModalBody"></div>
        </div>
    </div>

    <!-- Recent Precip Chart Modal -->
    <div class="pc-overlay" id="precipChartOverlay" onclick="if(event.target===this)closePrecipChart()">
        <div class="pc-modal">
            <div id="precipChartBody"></div>
        </div>
    </div>

    <!-- Pressure Chart Modal -->
    <div class="pc-overlay" id="pressureChartOverlay" onclick="if(event.target===this)closePressureChart()">
        <div class="pc-modal">
            <div id="pressureChartBody"></div>
        </div>
    </div>

    <!-- AQI Chart Modal -->
    <div class="pc-overlay" id="aqiChartOverlay" onclick="if(event.target===this)closeAQIChart()">
        <div class="pc-modal">
            <div id="aqiChartBody"></div>
        </div>
    </div>

    <!-- Current Condition / Station Obs Detail Modal -->
    <div class="pc-overlay" id="obsDetailOverlay" onclick="if(event.target===this)closeConditionDetail()">
        <div class="obs-modal">
            <button class="obs-modal-close" onclick="closeConditionDetail()">✕</button>
            <div id="obsDetailBody"></div>
        </div>
    </div>

    <!-- Forecast Day Detail Modal -->
    <div class="forecast-detail-overlay" id="forecastDetailOverlay"
         onclick="if(event.target===this)closeForecastDetail()">
        <div class="forecast-detail-modal" id="forecastDetailModal">
            <div class="forecast-detail-handle"></div>
            <div class="forecast-detail-header">
                <button class="forecast-detail-close" onclick="closeForecastDetail()">✕</button>
                <span class="forecast-detail-counter" id="forecastDetailCounter">1 of 7</span>
            </div>
            <div class="forecast-detail-body" id="forecastDetailBody"></div>
            <div class="forecast-detail-nav">
                <button class="forecast-nav-btn" id="forecastPrevBtn" onclick="navigateForecastDetail(-1)">‹</button>
                <button class="forecast-nav-btn" id="forecastNextBtn" onclick="navigateForecastDetail(1)">›</button>
            </div>
        </div>
    </div>
