# Collector configuration
# All times in seconds. All counts are integers unless noted.

# Polling cadence
poll_interval_sec: 180          # Time between successive polls for the same city
city_stagger_sec: 15            # Offset between cities at startup (spreads load)

# Rate limits
iem_rate_limit_rps: 1.0         # IEM endpoints throttle ~1 req/sec sustained
iem_burst_tokens: 5             # Burst budget before throttling kicks in
nexrad_tile_concurrency: 4      # Parallel tile fetches per radar poll

# GLM lightning (one shared fetcher across all cities)
glm_poll_interval_sec: 60
glm_enabled: true
glm_satellite: auto             # auto (per-city by longitude) | east (G19) | west (G18)
                                # G19 coverage is marginal west of ~106°W — Seattle needs G18

# RainViewer nowcast cross-check (consensus signal for rain timing).
# Set false to measure edge-only timing in a backtest comparison.
rainviewer_enabled: true

# Blitzortung ground-truth recorder (VALIDATION ONLY — never a warning source).
# Records community-network strikes to data/lightning_truth/ so lightning_eval.py
# can verify GLM warnings with km-accurate, independent strike locations.
# Requires: pip install websocket-client
blitzortung_truth_enabled: true

# Open-Meteo caching (10k/day free tier; cache hourly forecast aggressively)
openmeteo_hourly_cache_min: 30  # Re-fetch hourly forecast only after this many minutes
openmeteo_current_cache_min: 5  # Current weather is cheaper to refetch

# Paths
log_dir: data/logs              # City-partitioned subdirs created automatically
cities_file: data/cities.json   # Read once at startup; SIGHUP reloads
state_dir: data/collector_state # Persistent radar history + cache pickles

# Schema (must match what ingest.py expects)
schema_version: 2

# Logging
log_level: INFO                 # DEBUG | INFO | WARNING | ERROR
metrics_interval_sec: 300       # Print rolling stats every N seconds

# Shutdown
graceful_shutdown_sec: 30       # Max wait for in-flight polls on SIGTERM
